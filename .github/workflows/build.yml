name: Nix Build

on:
  workflow_call:
    inputs:
      runner:
        description: Native GitHub Actions runner label
        required: true
        type: string
      system:
        description: Native Nix system (for example x86_64-linux)
        required: true
        type: string
      ref:
        description: Immutable commit to build (defaults to the caller's SHA)
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Check and build ${{ inputs.system }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    env:
      SYSTEM: ${{ inputs.system }}

    steps:
      - name: Checkout build commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            sandbox = true

      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ inputs.system }}-${{ hashFiles('flake.lock', 'pnpm-lock.yaml', 'Cargo.lock') }}-${{ github.sha }}
          restore-prefixes-first-match: nix-${{ inputs.system }}-${{ hashFiles('flake.lock', 'pnpm-lock.yaml', 'Cargo.lock') }}-

      - name: Verify native system
        run: |
          actual_system=$(nix eval --impure --raw --expr builtins.currentSystem)
          if [[ "$actual_system" != "$SYSTEM" ]]; then
            echo "Expected $SYSTEM, but the runner is $actual_system" >&2
            exit 1
          fi

      - name: Run all flake checks
        run: nix flake check --print-build-logs

      - name: Build default package
        run: nix build .#default --print-build-logs

      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        run: /usr/bin/codesign --verify --deep --strict result/Applications/open-orpheus.app

      - name: Export complete runtime closure
        # Run the exporter in the dev shell for portable coreutils and zstd.
        run: |
          # SYSTEM is expanded by the inner shell, not the runner shell.
          # shellcheck disable=SC2016
          nix develop -c bash -euo pipefail -c '
            nix-store --export $(nix-store -qR "$(readlink -f result)") |
              zstd -T0 > "open-orpheus-${SYSTEM}.nar.zst"
          '
          test -s "open-orpheus-${SYSTEM}.nar.zst"

      - name: Upload runtime closure
        uses: actions/upload-artifact@v7
        with:
          name: open-orpheus-${{ inputs.system }}
          path: open-orpheus-${{ inputs.system }}.nar.zst
          if-no-files-found: error
          compression-level: 0
