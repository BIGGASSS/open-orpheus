name: Nix Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Nix (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    uses: ./.github/workflows/build.yml
    with:
      runner: ${{ matrix.runner }}
      system: ${{ matrix.system }}
      ref: ${{ github.sha }}
