name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify package version matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          with open("package.json", encoding="utf-8") as package_file:
              version = json.load(package_file)["version"]
          expected_tag = f"v{version}"
          tag = os.environ["RELEASE_TAG"]
          if tag != expected_tag:
              sys.exit(f"Tag {tag!r} does not match package.json version {expected_tag!r}")
          print(f"Verified {tag}")
          PY

  build:
    name: Release build (${{ matrix.system }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    uses: ./.github/workflows/build.yml
    with:
      runner: ${{ matrix.runner }}
      system: ${{ matrix.system }}
      ref: ${{ github.sha }}

  publish:
    name: Publish Nix closures
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download runtime closures
        uses: actions/download-artifact@v8
        with:
          pattern: open-orpheus-*
          path: release-files
          merge-multiple: true

      - name: Publish release with generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          # Refuse to publish if the tag moved while the builds were running.
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          assets=()
          for system in x86_64-linux aarch64-linux aarch64-darwin; do
            asset="release-files/open-orpheus-${system}.nar.zst"
            test -s "$asset"
            assets+=("$asset")
          done
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          # Draft first: no public release until every required asset is uploaded.
          # Existing releases are never deleted or overwritten automatically.
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag --target "$RELEASE_SHA" --draft --generate-notes \
            --title "Open Orpheus $RELEASE_TAG" "${flags[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
