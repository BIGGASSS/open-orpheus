name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect relevant changes
    uses: ./.github/workflows/changes.yml

  # Linux only: the packaging snapshots embed POSIX path separators.
  test-node:
    name: AVA & Vitest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.node == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  # Generate and lint the Flatpak manifest without building the application.
  test-flathub:
    name: Flatpak manifest lint
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.flathub == 'true' }}
    runs-on: ubuntu-latest
    env:
      LINTER_IMAGE: ghcr.io/flathub-infra/flatpak-builder-lint:unprivileged
      # flatpak-builder needs syscalls (user namespaces/bwrap) that Docker's
      # default seccomp profile blocks; this is the profile Flathub runs the
      # unprivileged image with.
      LINTER_SECCOMP_URL: https://raw.githubusercontent.com/flathub-infra/vorarbeiter/57e57bbb3d951c04cea355cb9335f5145d74704d/flatpak.seccomp.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install flatpak-node-generator and flatpak-cargo-generator
        run: |
          COMMIT=1fc32195e3e60fe5c97f0af646dec7a99df5962b
          TOOLS_DIR=/tmp/flatpak-builder-tools
          git clone --filter=blob:none https://github.com/flatpak/flatpak-builder-tools.git "$TOOLS_DIR"
          git -C "$TOOLS_DIR" checkout "$COMMIT"

          # node generator: installs a proper CLI entry point
          pip3 install --user "$TOOLS_DIR/node"

          # cargo generator: install via poetry as documented, then create a launcher
          pip3 install --user poetry
          poetry -C "$TOOLS_DIR/cargo" install --no-interaction
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/flatpak-cargo-generator" << EOF
          #!/bin/sh
          exec poetry -C "$TOOLS_DIR/cargo" run python3 "$TOOLS_DIR/cargo/flatpak-cargo-generator.py" "\$@"
          EOF
          chmod +x "$HOME/.local/bin/flatpak-cargo-generator"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Flatpak builder manifest
        run: node --experimental-strip-types scripts/build-flatpak-builder.ts

      - name: Download the linter seccomp profile
        run: curl -fsSL "$LINTER_SECCOMP_URL" -o flatpak.seccomp.json

      - name: Lint the generated manifest
        working-directory: out/make/flatpak-builder
        run: |
          # Targets for the container's TMPDIR/XDG_STATE_HOME below; keep them
          # inside the mount so nothing is written to unwritable paths.
          mkdir -p tmp .local/state
          docker run --rm \
            --security-opt apparmor=unconfined \
            --security-opt seccomp="$GITHUB_WORKSPACE/flatpak.seccomp.json" \
            -v "$PWD:/mnt" \
            -w /mnt \
            -e TMPDIR=/mnt/tmp \
            -e XDG_STATE_HOME=/mnt/.local/state \
            -e GITHUB_ACTIONS \
            "$LINTER_IMAGE" \
            --gha-format --exceptions --exceptions-repo stable \
            manifest io.github.yucling.open-orpheus.yaml
